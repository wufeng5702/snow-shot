name: Sync Fork with Upstream (Rebase Mode)

permissions:
  # 必须授予写权限，以便 Action 可以推送更改
  contents: write

on:
  schedule:
    - cron: '0 8 * * *' # 08:00 UTC (16:00 UTC+8)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 用 GitHub App 换 installation token（带 workflows 权限，可推 .github/workflows/* 变更）
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      # 同步逻辑统一维护在 wufeng5702/actions-sync-upstream，此处只负责触发
      - name: Sync fork with upstream via rebase
        uses: wufeng5702/actions-sync-upstream@main
        with:
          token: ${{ steps.app-token.outputs.token }}
